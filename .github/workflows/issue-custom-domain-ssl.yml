name: Issue Custom Domain SSL

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Primary custom domain (e.g. hawazin.shop)'
        required: true
        default: 'hawazin.shop'
      include_www:
        description: 'Include www subdomain (true/false)'
        required: true
        default: 'true'

jobs:
  issue-ssl:
    name: Issue SSL and Configure Nginx
    runs-on: ubuntu-latest
    env:
      SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
    steps:
      - name: Issue Certificate & Configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          timeout: 180s
          script: |
            set -e
            RAW_DOMAIN="${{ inputs.domain }}"
            INCLUDE_WWW="${{ inputs.include_www }}"
            
            # Sanitize domain name: lowercase, strip protocols, paths, spaces
            DOMAIN=$(echo "$RAW_DOMAIN" | tr '[:upper:]' '[:lower:]' | sed -E 's|^https?://||' | sed -E 's|/.*||' | tr -d ' ' | sed 's/[^a-z0-9.-]//g')
            echo "🚀 [SSL-PROVISION] Target domain: $DOMAIN (include_www: $INCLUDE_WWW)"

            if [ -z "$DOMAIN" ]; then
              echo "❌ Invalid domain name"
              exit 1
            fi

            # 1. Prepare webroot challenge directory
            echo "📁 Ensuring webroot .well-known/acme-challenge exists..."
            sudo mkdir -p /var/www/frontend2/dist/.well-known/acme-challenge
            sudo chmod -R 755 /var/www/frontend2/dist/.well-known

            # 2. Build certbot domain flags
            CERTBOT_FLAGS="-d $DOMAIN"
            SERVER_NAMES="$DOMAIN"
            if [ "$INCLUDE_WWW" = "true" ]; then
              CERTBOT_FLAGS="$CERTBOT_FLAGS -d www.$DOMAIN"
              SERVER_NAMES="$SERVER_NAMES www.$DOMAIN"
            fi

            # 3. Run Certbot via webroot mode
            echo "🔒 Requesting SSL certificate from Let's Encrypt for: $CERTBOT_FLAGS..."
            sudo certbot certonly --webroot -w /var/www/frontend2/dist \
              $CERTBOT_FLAGS \
              --non-interactive \
              --agree-tos \
              --email admin@maxp.online \
              --expand

            # 4. Verify certificate files exist
            CERT_PATH="/etc/letsencrypt/live/$DOMAIN/fullchain.pem"
            KEY_PATH="/etc/letsencrypt/live/$DOMAIN/privkey.pem"
            if [ ! -f "$CERT_PATH" ]; then
              echo "❌ Certificate file not found at $CERT_PATH"
              exit 1
            fi
            echo "✅ Certificate verified at $CERT_PATH"

            # 5. Generate dedicated Nginx configuration for this custom domain
            echo "⚙️ Creating Nginx server block in /etc/nginx/sites-available/$DOMAIN.conf..."
            cat << EOF | sudo tee /etc/nginx/sites-available/$DOMAIN.conf
            # Auto-generated Nginx configuration for Custom Domain: $DOMAIN
            server {
                listen 80;
                server_name $SERVER_NAMES;

                location /.well-known/acme-challenge/ {
                    root /var/www/frontend2/dist;
                    allow all;
                }

                location / {
                    return 301 https://\$host\$request_uri;
                }
            }

            server {
                listen 443 ssl http2;
                server_name $SERVER_NAMES;

                ssl_certificate $CERT_PATH;
                ssl_certificate_key $KEY_PATH;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

                root /var/www/frontend2/dist;
                index index.html;

                client_max_body_size 100M;

                # Security Headers
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "1; mode=block" always;

                # Assets caching
                location ^~ /assets/ {
                    try_files \$uri =404;
                    access_log off;
                    add_header Cache-Control "public, max-age=31536000, immutable";
                }

                # Uploads & User Media
                location ^~ /uploads/ {
                    alias /var/www/backend2/uploads/;
                    access_log off;
                    add_header Cache-Control "public, max-age=2592000" always;
                    add_header Access-Control-Allow-Origin "*" always;
                }

                # Static files
                location ~* \.(?:css|js|mjs|map|json|webmanifest|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
                    try_files \$uri =404;
                    access_log off;
                    add_header Cache-Control "public, max-age=2592000" always;
                }

                # Storefront HTML via Backend proxy (tenant SEO metadata & server rendering)
                location / {
                    proxy_pass http://maxp_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host \$host;
                    proxy_set_header X-Subdomain \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_next_upstream error timeout http_502;
                    proxy_next_upstream_tries 2;
                    proxy_read_timeout 300s;
                    proxy_connect_timeout 75s;
                    proxy_send_timeout 300s;
                }

                # Canonical API Requests
                location ^~ /api/v1/ {
                    proxy_pass http://maxp_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_read_timeout 300s;
                }

                # Legacy API
                location ^~ /api/ {
                    rewrite ^/api/(.*)$ /api/v1/\$1 break;
                    proxy_pass http://maxp_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }

                # Socket.IO
                location /socket.io/ {
                    proxy_pass http://maxp_backend/socket.io/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection "Upgrade";
                    proxy_set_header Host \$host;
                    proxy_cache_bypass \$http_upgrade;
                }
            }
EOF

            # 6. Enable site
            echo "🔗 Linking /etc/nginx/sites-available/$DOMAIN.conf to /etc/nginx/sites-enabled/..."
            sudo ln -sf /etc/nginx/sites-available/$DOMAIN.conf /etc/nginx/sites-enabled/$DOMAIN.conf

            # 7. Test Nginx and Reload
            echo "🧪 Testing Nginx configuration..."
            sudo nginx -t

            echo "🔄 Reloading Nginx service..."
            sudo systemctl reload nginx

            echo "🎉 [SUCCESS] SSL and Nginx successfully configured for $DOMAIN!"
