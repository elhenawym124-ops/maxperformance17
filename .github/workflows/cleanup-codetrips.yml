name: Cleanup Codetrips Commerce Apps & Sync Education RBAC

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (true = report only, false = apply changes)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      company_identifier:
        description: 'Company slug, ID, or search keyword (default: codetrips)'
        required: false
        default: 'codetrips'
        type: string

jobs:
  cleanup-codetrips:
    name: Cleanup Codetrips & Sync Education Permissions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Upload script to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: apps/backend/scripts/one-off/cleanup-codetrips-apps.js
          target: /var/www/backend2/scripts/one-off/
          strip_components: 4
          overwrite: true

      - name: Execute cleanup script on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          COMPANY_IDENTIFIER: ${{ github.event.inputs.company_identifier || 'codetrips' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script_stop: true
          envs: COMPANY_IDENTIFIER,DRY_RUN
          script: |
            set -euo pipefail
            cd /var/www/backend2
            echo "Current backend dir: $(pwd)"
            ls -la scripts/one-off/cleanup-codetrips-apps.js

            echo "Running with DRY_RUN=$DRY_RUN, COMPANY_IDENTIFIER=$COMPANY_IDENTIFIER"
            DRY_RUN="$DRY_RUN" COMPANY_IDENTIFIER="$COMPANY_IDENTIFIER" node scripts/one-off/cleanup-codetrips-apps.js
