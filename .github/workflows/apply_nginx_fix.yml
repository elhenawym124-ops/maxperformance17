name: Quick Nginx Fix

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  fix-nginx:
    runs-on: ubuntu-latest
    env:
      SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
    steps:
      - name: Issue Hawazin SSL & Configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          timeout: 180s
          script: |
            set -e
            echo "🚀 [SSL] Starting SSL issuance and Nginx configuration for hawazin.shop..."

            # 1. Prepare webroot acme directory
            echo "📁 Ensuring webroot directory exists..."
            sudo mkdir -p /var/www/frontend2/dist/.well-known/acme-challenge
            sudo chmod -R 755 /var/www/frontend2/dist/.well-known

            # 2. Update port 80 rule on maxp.online.conf if needed to guarantee acme challenge serves properly
            if ! grep -q "location /.well-known/acme-challenge/" /etc/nginx/sites-available/maxp.online.conf 2>/dev/null; then
              echo "⚙️ Adding acme-challenge block to port 80 in maxp.online.conf..."
              sudo sed -i '/server_name maxp.online \*\.maxp.online;/a \    location /.well-known/acme-challenge/ {\n        root /var/www/frontend2/dist;\n        allow all;\n    }' /etc/nginx/sites-available/maxp.online.conf
              sudo nginx -t && sudo systemctl reload nginx || true
            fi

            # 3. Request SSL Certificate via Certbot
            echo "🔒 Requesting Let's Encrypt certificate for hawazin.shop and www.hawazin.shop..."
            sudo certbot certonly --webroot -w /var/www/frontend2/dist \
              -d hawazin.shop -d www.hawazin.shop \
              --non-interactive \
              --agree-tos \
              --email admin@maxp.online \
              --expand

            # 4. Check certificate files
            CERT_PATH="/etc/letsencrypt/live/hawazin.shop/fullchain.pem"
            KEY_PATH="/etc/letsencrypt/live/hawazin.shop/privkey.pem"
            if [ ! -f "$CERT_PATH" ]; then
              echo "❌ Certificate not found at $CERT_PATH"
              exit 1
            fi
            echo "✅ Certificate found at $CERT_PATH"

            # 5. Write dedicated Nginx server block for hawazin.shop
            echo "⚙️ Writing /etc/nginx/sites-available/hawazin.shop.conf..."
            cat << 'EOF' | sudo tee /etc/nginx/sites-available/hawazin.shop.conf
            server {
                listen 80;
                server_name hawazin.shop www.hawazin.shop;

                location /.well-known/acme-challenge/ {
                    root /var/www/frontend2/dist;
                    allow all;
                }

                location / {
                    return 301 https://$host$request_uri;
                }
            }

            server {
                listen 443 ssl http2;
                server_name hawazin.shop www.hawazin.shop;

                ssl_certificate /etc/letsencrypt/live/hawazin.shop/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/hawazin.shop/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

                root /var/www/frontend2/dist;
                index index.html;

                client_max_body_size 100M;

                # Security Headers
                add_header X-Frame-Options "SAMEORIGIN" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header X-XSS-Protection "1; mode=block" always;

                # Assets caching
                location ^~ /assets/ {
                    try_files $uri =404;
                    access_log off;
                    add_header Cache-Control "public, max-age=31536000, immutable";
                }

                # Uploads & User Media
                location ^~ /uploads/ {
                    alias /var/www/backend2/uploads/;
                    access_log off;
                    add_header Cache-Control "public, max-age=2592000" always;
                    add_header Access-Control-Allow-Origin "*" always;
                }

                # Static files
                location ~* \.(?:css|js|mjs|map|json|webmanifest|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
                    try_files $uri =404;
                    access_log off;
                    add_header Cache-Control "public, max-age=2592000" always;
                }

                # Storefront HTML via Backend proxy (tenant SEO metadata & server rendering)
                location / {
                    proxy_pass http://maxp_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host $host;
                    proxy_set_header X-Subdomain $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_next_upstream error timeout http_502;
                    proxy_next_upstream_tries 2;
                    proxy_read_timeout 300s;
                    proxy_connect_timeout 75s;
                    proxy_send_timeout 300s;
                }

                # Canonical API Requests
                location ^~ /api/v1/ {
                    proxy_pass http://maxp_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_read_timeout 300s;
                }

                # Legacy API
                location ^~ /api/ {
                    rewrite ^/api/(.*)$ /api/v1/$1 break;
                    proxy_pass http://maxp_backend;
                    proxy_http_version 1.1;
                    proxy_set_header Connection "";
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                # Socket.IO
                location /socket.io/ {
                    proxy_pass http://maxp_backend/socket.io/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "Upgrade";
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                }
            }
EOF

            # 6. Enable site
            echo "🔗 Linking /etc/nginx/sites-available/hawazin.shop.conf to sites-enabled..."
            sudo ln -sf /etc/nginx/sites-available/hawazin.shop.conf /etc/nginx/sites-enabled/hawazin.shop.conf

            # 7. Test Nginx and Reload
            echo "🧪 Testing Nginx configuration..."
            sudo nginx -t

            echo "🔄 Reloading Nginx service..."
            sudo systemctl reload nginx

            echo "🎉 [SUCCESS] hawazin.shop SSL & Nginx configured and active!"
