name: Quick Nginx Fix

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  fix-nginx:
    name: Quick Nginx Fix and Hawazin SSL
    runs-on: ubuntu-latest
    env:
      SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
    steps:
      - name: Issue Hawazin SSL & Configure Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_SSH_PORT }}
          timeout: 180s
          script: |
            echo "" | base64 -d | bash -s -- "hawazin.shop" "true"
